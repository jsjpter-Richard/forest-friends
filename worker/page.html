function render(){stopHideGame();document.getElementById('navhome').className=page==='home'?'active':'';document.getElementById('navplay').className=page==='play'?'active':'';document.getElementById('profile').innerHTML=me?avatar(me.animal,'',me.outfit)+'<span>'+esc(me.name)+'</span>':'';document.getElementById('navstyle').className=page==='style'?'active':'';document.getElementById('navfriends').className=page==='friends'?'active':'';Soundscape.sync();document.getElementById('app').innerHTML=page==='home'?home():page==='friends'?friendsPage():page==='style'?stylePage():play();updateSocialChrome();tick();showRoomPresence();reportRoomPresence();if(page==='play'&&room?.game==='hide')mountHideGame()}
function residents(){const slots=[[48,62.5],...ZooMath.spots.map(([x,y])=>[x/10,y/5.6])];const list=[{name:me?.name||'You',animal:me?.animal||0,outfit:me?.outfit},...(me?.friends||[]).slice(0,9)];return list.map((f,i)=>`<button class="resident" style="left:${slots[i][0]}%;top:${slots[i][1]}%;--delay:-${i*1.7}s" onclick="residentDetail(${i})" aria-label="Visit ${esc(f.name)} the ${names[f.animal]}">${avatar(f.animal,'',f.outfit)}<span class="resident-name ${i===0?'me':''}">${i===0?'You · ':''}${esc(f.name)}</span></button>`).join('')}
function home(){return `<section class="welcome grove-welcome"><div><div class="eyebrow">FIELD NOTES FROM PEBBLE GROVE</div><h1>Nothing much to do. Good company to do it with.</h1><p>Wander by the pond, share a snack, or challenge a friend. The clearing can wait.</p></div><div class="stats"><div class="stat"><b>${me?.score||0}</b><small>POINTS</small></div><div class="stat"><b>${me?.friends.length||0}</b><small>ZOO KEEPSAKES</small></div><button class="primary" onclick="go('play')">Let’s Play ↗</button></div></section><section class="park-shell" aria-label="Your animated friendship zoo"><div class="park-top"><b>❧ ${me?esc(me.name)+'’s':'Your'} Pebble Grove</b><span class="tag"><span class="dot"></span> Pebble Grove · Take your time</span></div><div class="park-scroll" onclick="if(event.target.closest('.resident')===null)enterZoo()" tabindex="0" onkeydown="if(event.key==='Enter'&&event.target===this){event.preventDefault();enterZoo()}" aria-label="Your zoo preview. Tap to explore."><div class="park">${park()}${residents()}${!me?.friends.length?'<div class="habitat-sign" style="left:69%;top:45%">Room for a new neighbour ♡</div>':''}</div></div><div class="park-tip"><span><b>The long way round is fine.</b><small>Follow the path, or leave it. Say hello along the way.</small></span><div class="grove-actions"><button class="secondary" onclick="visitPond()">⌁ Visit the Pond</button><button class="primary" id="enter-zoo" onclick="enterZoo()">Explore My Zoo ↗</button></div></div><div class="home-notes">${groveGlyph('leaf')}<span>A striped pebble, a familiar bench, a page worth keeping.</span><button onclick="openPocketNotes()">Pocket notes ↗</button></div></section><section class="grove-activities"><article class="card grove-activity"><div class="activity-icon pond-icon">⌁</div><span class="eyebrow">A MOMENT TO YOURSELF</span><h3>No meetings at the pond.</h3><p>Find your rhythm, reel in a fish, and share your catch with a resident.</p><button class="text-action" onclick="visitPond()">Go Fishing <span>↗</span></button></article><article class="card grove-activity"><div class="activity-icon style-icon">✿</div><span class="eyebrow">A STYLE THAT FEELS LIKE YOU</span><h3>Your well-worn favourites.</h3><p>Try a new animal, find a favorite outfit, and take it everywhere.</p><button class="text-action" onclick="go('style')">Visit the Outfitter <span>↗</span></button></article><article class="card grove-activity"><div class="activity-icon friends-icon">♡</div><span class="eyebrow">ALWAYS ROOM FOR A FRIEND</span><h3>Good company. Good games.</h3><p>Hide behind a bush, think over a Gomoku board, or settle it with scissors.</p><button class="text-action" onclick="go('play')">Play Together <span>↗</span></button></article></section><div class="section-title"><div><div class="eyebrow">YOUR FRIENDSHIP ALBUM</div><h2 style="margin-top:7px">The lovely little residents</h2></div><span class="tag">${me?.friends.length||0} collected</span></div>${me?.friends.length?`<div class="shelf">${me.friends.map((f,i)=>`<button class="friend-card" onclick="residentDetail(${i+1})">${avatar(f.animal,'',f.outfit)}<b>${esc(f.name)}</b><small>${names[f.animal]} · A friend to keep</small></button>`).join('')}</div>`:'<div class="empty-shelf">A little space for a familiar face.<br><span class="tiny">Win a friendly match and invite their animal into your grove.</span><br><button class="secondary" style="margin-top:15px" onclick="go(&quot;play&quot;)">Invite a Friend ↗</button></div>'}`}
function play(){if(roomCode&&room?.game==='hide')return renderHideRoom(room);if(roomCode&&room?.game==='gomoku')return renderGomoku(room);if(!roomCode)return `<div class="eyebrow">A FRIENDLY LITTLE FACE-OFF</div><h1>Meet you in the forest?</h1><p>A room code starts a game, not a friendship. Add each other in Friends to stay connected.</p>${gamePicker()}<div class="join-grid"><section class="card">${avatar(me?.animal||0,'',me?.outfit)}<h2>Make a little room</h2><p>Choose your game above, then share the room code.</p><button class="primary" onclick="createRoom()">Create ${selectedGame==='hide'?'Hide & Seek':selectedGame==='gomoku'?'Gomoku':'RPS'} Room ↗</button></section><section class="card">${avatar(1)}<h2>Got an invitation?</h2><p>Enter your friend’s 5-character room code.</p><label class="tiny" for="joincode">ROOM CODE</label><input id="joincode" placeholder="e.g. F7K2A" maxlength="8" autocapitalize="characters" autocomplete="off"><div class="actions"><button class="primary" onclick="joinRoom()">Join Friend →</button></div></section></div><p class="tiny" style="margin-top:25px">Hide & Seek: take turns · Gomoku: connect five · RPS: best of three</p>`;
const f=room?.friend,r=room?.round,m=room?.match,done=m?.done;
return `<section class="welcome"><div><div class="eyebrow">SMALL CHALLENGES, SWEET REWARDS</div><h1>Rock, Paper, Scissors.</h1></div><button class="secondary" onclick="leave()">Leave Room</button></section><div class="grid"><aside class="card"><span class="tag"><span class="dot"></span>${f?roomStatusLabel(room):'Waiting for a friend'}</span><h2 style="margin-top:23px">Your cozy room</h2><p class="tiny">Send this code to your friend.</p><div class="code">${esc(roomCode)}</div><button class="secondary" onclick="copyCode()">Copy Code ⧉</button><div style="margin-top:25px"><div class="rule"><strong>01</strong><span>First to 2 round wins takes the match. Ties don’t count.</span></div><div class="rule"><strong>02</strong><span>Both tap Ready before every round. Then you have 8 seconds to choose.</span></div><div class="rule"><strong>03</strong><span>No move before time runs out? You lose the round. Both miss? Replay.</span></div><div class="rule"><strong>04</strong><span>The match winner earns 1 point and can collect their friend’s animal.</span></div></div>${m?.result==='win'?`<div class="collect-panel"><div class="eyebrow">A NEW FRIENDSHIP</div><p>${room.collected?'This friend already has a home in your zoo.':'You won the match! Their animal can now join your zoo.'}</p><button class="primary" ${room.collected?'disabled':''} onclick="collect()">${room.collected?'✓ Already in Your Zoo':'+ Add Friend to My Zoo'}</button></div>`:''}</aside><section class="card arena"><div class="arena-head"><span class="eyebrow">MATCH ${m?.n||1}</span><span class="tag">BEST OF THREE · FIRST TO 2</span></div><div class="scoreboard"><div><div class="score">${m?.mine||0} : ${m?.other||0}</div><div class="score-note">YOU &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; FRIEND</div></div></div><div class="duel"><div class="duelist">${avatar(me?.animal||0,'',me?.outfit)}<b>${esc(me?.name||'You')}</b><span class="ready-status ${r?.ready?'yes':''}">${r?.done?'Round complete':r?.deadline?(r.locked?'✓ Move locked':'Choosing…'):(r?.ready?'✓ Ready to play':'Not ready yet')}</span></div><span class="vs">vs.</span><div class="duelist">${f?avatar(f.animal,'',f.outfit):'<div class="egg">?</div>'}<b>${f?esc(f.name):'A friend goes here'}</b><span class="ready-status ${r?.otherReady?'yes':''}">${r?.done?'Round complete':r?.deadline?(r.otherLocked?'✓ Move locked':'Choosing…'):(r?.otherReady?'✓ Ready to play':'Not ready yet')}</span></div></div>${!f?'<h3>There’s a little room for two.</h3><p class="tiny">Your friend will appear here when they join.</p>':done?matchResult(m):!r||!r.deadline?waiting(r):r.done?roundResult(r):activeRound(r)}<p class="tiny" style="margin-top:22px">A friendship keepsake never takes away your friend’s character.</p></section></div>`}
function waiting(r){return `<span class="tag">${r?'ROUND '+r.n:'ROUND 1'}</span><h3>${r?.ready?'Your friend is almost ready…':'Ready for a little challenge?'}</h3><p class="tiny">The 8-second timer starts only when you’re both ready.</p><div class="actions" style="justify-content:center"><button class="primary ready-btn" ${r?.ready?'disabled':''} onclick="ready()">${r?.ready?'✓ You’re Ready':'I’m Ready ✓'}</button></div>`}
function activeRound(r){return `<div class="countdown" id="countdown"><strong id="seconds">8</strong><span>SECONDS LEFT<br><b>${r.locked?'Your move is locked':'Choose your move!'}</b></span></div><div class="moves">${moves.map((m,i)=>`<button ${r.locked?'disabled':''} class="${r.mine===i?'chosen':''}" onclick="choose(${i})" aria-label="Choose ${moveNames[i]}">${m}<small>${moveNames[i]}</small></button>`).join('')}</div><p class="tiny" id="timer-note">${r.locked?'Waiting for your friend. No peeking!':'One choice. No take-backs. You’ve got this.'}</p>`}
function reveals(r){return `<div class="reveals"><div>${r.mine===null?'—':moves[r.mine]}<small>You${r.mine===null?' · No move':''}</small></div><div>${r.other===null?'—':moves[r.other]}<small>Friend${r.other===null?' · No move':''}</small></div></div>`}
function roundResult(r){return `<div class="result ${r.result}"><div class="eyebrow">ROUND ${r.n} COMPLETE</div><h2>${r.result==='win'?'A little victory!':r.result==='lose'?'This round goes to your friend.':r.reason==='timeout'?'Nobody chose. Let’s try again.':'Great minds think alike!'}</h2><p>${r.reason==='timeout'?(r.result==='draw'?'Both players timed out. No round win awarded.':'Time ran out. The player who chose a move wins.'):(r.result==='draw'?'A tie! Nobody scores.':'One step closer to a new friendship.')}</p>${reveals(r)}</div><p class="tiny">Both players need to get ready for the next round.</p><button class="primary ready-btn" onclick="ready()">Ready for Next Round ✓</button>`}
function matchResult(m){const r=room.round;return `<div class="result ${m.result}"><div class="eyebrow">MATCH COMPLETE · ${m.mine}–${m.other}</div><h2>${m.result==='win'?'You won the match! ♡':'A good game, a good friend.'}</h2><p>${m.result==='win'?' +1 point · You can now collect your friend’s animal.':'Your friend won this match. Win the rematch to collect their animal.'}</p>${r?reveals(r):''}</div><div class="actions" style="justify-content:center">${m.result==='win'&&!room.collected?'<button class="primary" onclick="collect()">+ Collect Friend’s Animal</button>':''}<button class="${m.result==='win'&&!room.collected?'secondary':'primary'}" onclick="rematch()">Ready for a Rematch ↗</button></div>`}
function onboarding(){document.getElementById('overlay').innerHTML=`<div class="modalback"><div class="modal"><div class="eyebrow">HELLO, NEIGHBOUR</div><h2>Who’s your forest friend?</h2><p>Choose a companion for the clearing. You can change later.</p><label for="nickname">YOUR NICKNAME</label><input id="nickname" maxlength="16" placeholder="What should your friends call you?"><div class="choices">${names.map((n,i)=>`<button class="choice ${selected===i?'selected':''}" onclick="selectAnimal(${i})" aria-label="${n}">${avatar(i)}${n}</button>`).join('')}</div><button class="primary" style="width:100%" onclick="register()">Let’s Go to the Forest →</button><p class="tiny">Your profile lives in this browser. Keep your browser data to come back to your zoo.</p></div></div>`}
function selectAnimal(i){selected=i;document.querySelectorAll('.choice').forEach((el,n)=>el.classList.toggle('selected',n===i))}
function register(){task(async()=>{const name=document.getElementById('nickname').value.trim();if(!name)throw Error('Choose a nickname first.');const v=await api('register',{name,animal:selected});token=v.token;localStorage.setItem('forest-token',token);await refreshMe();await loadSocial(false);document.getElementById('overlay').innerHTML='';render()})}
async function refreshMe(){me=await api('me')}
function createRoom(){task(async()=>{const v=await api('create',{game:selectedGame});switchRoom(v.code);await poll();render()})}
function joinRoom(){const code=document.getElementById('joincode').value;task(async()=>{const v=await api('join',{code});switchRoom(v.code);await poll();render()})}
function leave(){reportRoomPresence('left',true,roomCode);roomCode='';room=null;presenceNotice=null;sessionStorage.removeItem('forest-room');document.getElementById('status').textContent='';render()}
function ready(){const r=room?.round;task(async()=>{await api('ready',{code:roomCode,match:room.match.id,bout:r?.id,next:!!r?.done});await poll()})}
function rematch(){task(async()=>{await api('rematch',{code:roomCode,match:room.match.id});await poll()})}
function choose(move){task(async()=>{await api('move',{code:roomCode,round:room.round.id,move});await poll()})}
function collect(){task(async()=>{await api('collect',{code:roomCode});await refreshMe();await poll();toast('A new friend has arrived in your zoo!')})}
async function copyCode(){try{await navigator.clipboard.writeText(roomCode);toast('Code copied! Send it to your friend.')}catch{toast('Please copy this code: '+roomCode)}}
function residentDetail(index){const f=index===0?me:me?.friends[index-1];if(!f)return;document.getElementById('overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal" style="text-align:center;max-width:360px"><div class="modal-top"><span class="eyebrow">${index===0?'YOUR FOREST COMPANION':'A FRIENDSHIP TO KEEP'}</span><button class="close" onclick="closeModal()" aria-label="Close">×</button></div><div class="pet-large">${avatar(f.animal,'',f.outfit)}</div><h2>${esc(f.name)}</h2><span class="tag">${names[f.animal]} · ${index===0?'That’s you!':'Zoo resident'}</span><p class="tiny">${index===0?habitOf(f.animal).note:'A little keepsake from a friendly challenge. Your friend still has their own animal.'}</p><button class="secondary" onclick="closeModal()">See You Around ♡</button></div></div>`}
function closeModal(){document.getElementById('overlay').innerHTML=''}
let polling=false;async function poll(){if(!roomCode||!token||polling)return;polling=true;try{const requestedCode=roomCode;await reportRoomPresence();const started=Date.now(),v=await api('room?code='+encodeURIComponent(roomCode));if(roomCode!==requestedCode)return;serverOffset=v.serverNow-(started+Date.now())/2;delete v.serverNow;const prior=room,changed=JSON.stringify(v)!==JSON.stringify(room);room=v;notifyRoomPresence(v);if(v.game==='hide'){const awarded=v.hide?.done&&(!prior?.hide?.done||prior.hide.id!==v.hide.id);if(awarded)await refreshMe();if(changed&&!zoo){if(page==='play'){if(hideView)updateHideRoom(v);else render()}else if(awarded)render()}}else if(changed){await refreshMe();if(!zoo)render()}document.getElementById('status').textContent=''}catch(e){document.getElementById('status').textContent='Connection interrupted. Retrying: '+e.message}finally{polling=false}}

function switchRoom(code){if(roomCode&&roomCode!==code)reportRoomPresence('left',true,roomCode);roomCode=code;room=null;presenceNotice=null;lastPresenceAt=0;sessionStorage.setItem('forest-room',roomCode)}
function reportRoomPresence(explicit=null,keepalive=false,code=roomCode){if(!token||!code)return Promise.resolve();const state=explicit||(document.hidden?'away':page==='play'&&!zoo?'active':'busy');if(!explicit&&lastPresenceRoom===code&&lastPresenceState===state&&Date.now()-lastPresenceAt<4000)return Promise.resolve();lastPresenceAt=Date.now();lastPresenceRoom=code;lastPresenceState=state;return fetch('/api/presence',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({code,state,session:roomSession,seq:++presenceSeq}),keepalive}).then(res=>{if(!res.ok)lastPresenceAt=0}).catch(()=>{lastPresenceAt=0})}
function presenceWords(state){return {active:['Back at the table','Your friend is here and ready to continue.'],busy:['Your friend is busy elsewhere','They are viewing another part of the game. Wait for them to return.'],away:['Your friend stepped away','They switched away from this game page. They may be back shortly.'],left:['Your friend left the room','You can leave this room or wait for them to rejoin using its code.'],offline:['Your friend is offline or disconnected','Their connection is no longer active. You can wait here for them to reconnect.'],unknown:['Connecting to your friend','Waiting for an update from their game.']}[state]||['Waiting for a friend','Share the room code to invite them.']}
function roomStatusLabel(v){return {active:v?.game==='hide'?'Friend in the grove':'Friend at the table',busy:'Friend is busy',away:'Friend stepped away',left:'Friend left the room',offline:'Friend is offline',unknown:'Checking friend’s status'}[v?.presence?.state]||'Friend joined'}
function showRoomPresence(){document.getElementById('room-presence-notice')?.remove();if(page!=='play'||!room?.friend)return;const state=room.presence?.state||'unknown';if(!['active','unknown','waiting'].includes(state))document.querySelectorAll('.ready-btn,button[onclick="rematch()"],button[onclick="gomokuReady()"],button[onclick="gomokuRematch()"]').forEach(b=>b.disabled=true);if(state==='active'&&presenceNotice!=='returned')return;const [title,detail]=presenceWords(state),el=document.createElement('div');el.id='room-presence-notice';el.className='room-presence '+state;el.setAttribute('role','status');el.innerHTML=`<span class="presence-symbol">${state==='active'?'●':state==='left'?'↗':'◷'}</span><div><b>${esc(title)}</b><p>${esc(detail)}</p>${room.game==='rps'&&room.round?.deadline&&!room.round.done?'<small>The current 8-second round still follows the usual timer.</small>':room.game==='gomoku'?'<small>Your stones remain saved. Leaving alone does not award a win.</small>':room.game==='hide'?'<small>The clock pauses while a player is away. Your hiding place stays saved.</small>':''}</div>`;const app=document.getElementById('app'),welcome=app.querySelector('.welcome');if(welcome)welcome.after(el);else app.prepend(el)}
let previousPresence=null,previousPresenceCode='';
function notifyRoomPresence(v){if(!v.friend)return;const state=v.presence?.state||'unknown',sameRoom=previousPresenceCode===v.code;if(sameRoom&&previousPresence!==state){if(state==='active'&&previousPresence!=='unknown'){presenceNotice='returned';toast(v.friend.name+' is back at the table.')}else if(!['active','unknown','waiting'].includes(state)){presenceNotice=null;toast(v.friend.name+': '+presenceWords(state)[0].replace('Your friend ','').toLowerCase())}}previousPresence=state;previousPresenceCode=v.code;showRoomPresence()}

function tick(){const r=room?.round;if(page!=='play'||!r?.deadline||r.done)return;const left=Math.max(0,Math.ceil((r.deadline-Date.now()-serverOffset)/1000)),el=document.getElementById('seconds');if(el)el.textContent=left;document.getElementById('countdown')?.classList.toggle('urgent',left<=2);if(left===0){document.querySelectorAll('.moves button').forEach(el=>el.disabled=true);const note=document.getElementById('timer-note');if(note)note.textContent='Time’s up! Checking the result…'}}
async function init(){render();if(token){try{await refreshMe();await loadSocial(false);render();await poll()}catch(e){toast(e.message);if(e.message==='Please choose your animal first.'){token=null;localStorage.removeItem('forest-token');onboarding()}}}else onboarding()}

let socialState=null,socialLoading=false,socialError='';
function updateSocialChrome(){const count=socialState?.requests.filter(r=>r.direction==='received').length||0;const badge=document.getElementById('friendbadge');if(badge)badge.innerHTML=count?`<span class="friend-badge">${count}</span>`:'';document.getElementById('invitebox').innerHTML=(socialState?.invitations||[]).map(v=>`<div class="invite-banner">${avatar(v.animal)}<div class="social-info"><b>${esc(v.name)} invited you to play!</b><p>${v.game==='hide'?'Hide & Seek · A little disappearing act.':v.game==='gomoku'?'Gomoku · A game across the table.':'Rock, Paper, Scissors · Best of three.'} Invitation lasts 2 minutes.</p></div><div class="actions"><button class="primary" onclick="answerInvite('${v.id}',true)">Join Game ↗</button><button class="secondary" onclick="answerInvite('${v.id}',false)">Decline</button></div></div>`).join('')}
async function loadSocial(redraw=false){if(!token||socialLoading)return;socialLoading=true;try{const v=await api('social');const changed=JSON.stringify(v)!==JSON.stringify(socialState);socialState=v;socialError='';updateSocialChrome();if(!zoo&&redraw&&changed&&page==='friends'&&document.activeElement?.tagName!=='INPUT')render()}catch(e){socialError=e.message}finally{socialLoading=false}}
function socialRow(f,kind){const incoming=kind==='received';return `<div class="social-row">${avatar(f.animal,'',f.outfit)}<div class="social-info"><b>${esc(f.name)}</b><small>${names[f.animal]} · ${esc(f.code)}</small><small class="${f.online?'online':''}">${kind==='friend'?(f.online?'Online now':'Offline'):incoming?'Wants to be your friend':'Request sent · Waiting for acceptance'}</small>${kind==='friend'?`<div class="actions"><button class="primary" ${!f.online?'disabled':''} onclick="inviteFriend('${f.code}')">Invite to Play ↗</button></div>`:incoming?`<div class="actions"><button class="primary" onclick="answerFriend('${f.code}',true)">Accept ♡</button><button class="secondary" onclick="answerFriend('${f.code}',false)">Decline</button></div>`:''}</div></div>`}
function friendsPage(){const friends=socialState?.friends||[],requests=socialState?.requests||[];return `<section class="welcome"><div><div class="eyebrow">THE FOREST IS BETTER TOGETHER</div><h1>Your circle of friends.</h1><p>Real friends, a little friendly competition, and room for more.</p></div><span class="tag">${friends.filter(f=>f.online).length} online · ${friends.length} friends</span></section><div class="friend-layout"><aside><div class="card"><div class="eyebrow">YOUR FRIEND ID · 6 CHARACTERS</div><div class="friend-id">${esc(socialState?.code||'…')}</div><p class="tiny">Share this ID to receive friend requests. It’s different from a room code.</p><button class="secondary" onclick="copyFriendID()">Copy My ID ⧉</button><div class="note-box">Friendships need both players to agree. Joining a room or collecting an animal never adds a friend automatically.</div></div><div class="card" style="margin-top:20px"><h2>Find a forest friend</h2><label class="tiny" for="friendid">THEIR 6-CHARACTER FRIEND ID</label><input id="friendid" maxlength="6" placeholder="e.g. FERN72" autocapitalize="characters" autocomplete="off"><div class="actions"><button class="primary" onclick="addFriend()">Send Friend Request ♡</button></div></div></aside><div><section class="card"><div class="eyebrow">YOUR FRIENDS</div><h2>Good company.</h2>${friends.length?friends.map(f=>socialRow(f,'friend')).join(''):'<div class="empty-shelf">Your circle starts with one hello.<br><span class="tiny">Send a request using your friend’s ID.</span></div>'}<p class="tiny">Online means active in the game recently. Status updates about every 10 seconds.</p></section><section class="card requests"><div class="eyebrow">HELLO, NEIGHBOUR</div><h2>Friend requests</h2>${requests.length?requests.map(f=>socialRow(f,f.direction)).join(''):'<p class="tiny">No pending requests. A new friendship could be just around the corner.</p>'}</section>${socialError?`<p class="social-error">${esc(socialError)}</p>`:''}</div></div>`}
function addFriend(){const friend=document.getElementById('friendid').value;task(async()=>{await api('social/add',{friend});await loadSocial(false);render();toast('Friend request sent. They need to accept first.')})}
function answerFriend(friend,accept){task(async()=>{await api('social/respond',{friend,accept});await loadSocial(false);render();toast(accept?'You’re now friends!':'Request declined.')})}
function inviteFriend(friend){openGameInvite(friend)}
function answerInvite(invite,accept){task(async()=>{const v=await api('social/respond-invite',{invite,accept});await loadSocial(false);if(accept){switchRoom(v.code);page='play';await poll();render()}else updateSocialChrome()})}
async function copyFriendID(){try{await navigator.clipboard.writeText(socialState.code);toast('Friend ID copied!')}catch{toast('Your Friend ID: '+(socialState?.code||'Open Friends to load it.'))}}
setInterval(()=>{if(!document.hidden)loadSocial(true)},10000);

setInterval(tick,100);setInterval(()=>{if(!document.hidden)poll()},750);document.addEventListener('visibilitychange',()=>{if(!document.hidden){reportRoomPresence();poll();loadSocial(true)}else{reportRoomPresence('away',true);if(token)fetch('/api/social/offline',{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:'{}',keepalive:true}).catch(()=>{})}});window.addEventListener('pagehide',()=>reportRoomPresence('offline',true));window.addEventListener('pageshow',()=>reportRoomPresence());window.addEventListener('offline',()=>{document.getElementById('status').textContent='You are offline. Your friend will be notified if the connection does not return.'});window.addEventListener('online',()=>{reportRoomPresence();poll()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&me&&!zoo?.fishing)closeModal()});init();
</script></html>
